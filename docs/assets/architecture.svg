<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="960" height="620" fill="#f8fafc"/>
  <text x="480" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">vibe-pilot — context optimizer for AI engineers</text>
  <text x="480" y="78" text-anchor="middle" font-size="14" fill="#475569">CLI + MCP server · one core engine · .context/ brief for Cursor / Claude Code / Windsurf</text>

  <!-- interfaces column -->
  <text x="140" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#334155" letter-spacing="1">INTERFACES</text>
  <g>
    <rect x="40" y="145" width="200" height="74" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="140" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">vibe-pilot CLI</text>
    <text x="140" y="196" text-anchor="middle" font-size="11.5" fill="#4f46e5">scan · focus · context · init</text>
  </g>
  <g>
    <rect x="40" y="245" width="200" height="74" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="140" y="275" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">MCP server (stdio)</text>
    <text x="140" y="296" text-anchor="middle" font-size="11.5" fill="#4f46e5">4 tools · JSON-RPC · ~24k cap</text>
  </g>

  <!-- engine column -->
  <text x="470" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#334155" letter-spacing="1">CORE ENGINE</text>
  <g>
    <rect x="330" y="145" width="280" height="88" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="470" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">scanner</text>
    <text x="470" y="189" text-anchor="middle" font-size="11.5" fill="#64748b">gitignore-aware walk · 7 file classes</text>
    <text x="470" y="206" text-anchor="middle" font-size="11.5" fill="#64748b">boilerplate rules · 512KB oversize guard</text>
  </g>
  <g>
    <rect x="330" y="249" width="280" height="88" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="470" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">import graph</text>
    <text x="470" y="293" text-anchor="middle" font-size="11.5" fill="#64748b">JS/TS + Python · workspaces · tsconfig paths</text>
    <text x="470" y="310" text-anchor="middle" font-size="11.5" fill="#64748b">entry detection · reachability → cold files</text>
  </g>
  <g>
    <rect x="330" y="353" width="280" height="88" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="470" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">hotspots + focus</text>
    <text x="470" y="397" text-anchor="middle" font-size="11.5" fill="#64748b">git log --name-only (30d window)</text>
    <text x="470" y="414" text-anchor="middle" font-size="11.5" fill="#64748b">focus terms · 1-hop neighbors at half weight</text>
  </g>
  <g>
    <rect x="330" y="457" width="280" height="88" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="470" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">context builder</text>
    <text x="470" y="501" text-anchor="middle" font-size="11.5" fill="#64748b">token budget fit (60k balanced)</text>
    <text x="470" y="518" text-anchor="middle" font-size="11.5" fill="#64748b">tiered file index · pruned tree</text>
  </g>

  <!-- interfaces -> engine -->
  <path d="M 240 182 C 285 182, 290 189, 330 189" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 240 282 C 285 282, 290 293, 330 293" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- engine internal flow -->
  <path d="M 470 233 L 470 249" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 470 337 L 470 353" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 470 441 L 470 457" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- output column -->
  <text x="800" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#334155" letter-spacing="1">OUTPUT</text>
  <g>
    <rect x="680" y="145" width="240" height="230" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="800" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">.context/</text>
    <g font-size="12.5" fill="#047857" font-family="Menlo, Consolas, monospace">
      <rect x="700" y="192" width="200" height="30" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="800" y="211" text-anchor="middle">PROJECT.md</text>
      <rect x="700" y="230" width="200" height="30" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="800" y="249" text-anchor="middle">tree.txt</text>
      <rect x="700" y="268" width="200" height="30" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="800" y="287" text-anchor="middle">files.json</text>
      <rect x="700" y="306" width="200" height="30" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="800" y="325" text-anchor="middle">manifest.json</text>
    </g>
    <text x="800" y="360" text-anchor="middle" font-size="11" fill="#047857">▲ hot · ✦ focus · ~ cold</text>
  </g>

  <!-- consumers -->
  <g>
    <rect x="680" y="415" width="240" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="800" y="443" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">AI agents read the brief first</text>
    <g font-size="12" fill="#475569">
      <text x="800" y="470" text-anchor="middle">Cursor · Claude Code · Windsurf</text>
      <text x="800" y="492" text-anchor="middle">any LLM via MCP get_context</text>
    </g>
    <text x="800" y="525" text-anchor="middle" font-size="12" font-weight="700" fill="#4f46e5">300.6M raw → 877k brief (−99.7%)</text>
  </g>

  <!-- builder -> context dir -->
  <path d="M 610 501 C 655 501, 650 260, 680 260" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- context -> consumers -->
  <path d="M 800 375 L 800 415" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- footer -->
  <rect x="0" y="590" width="960" height="30" fill="url(#heroGrad)" opacity="0.12"/>
  <text x="480" y="610" text-anchor="middle" font-size="11.5" fill="#4338ca">MIT · TypeScript · @modelcontextprotocol/sdk · 21-repo benchmark in docs/benchmark.json</text>
</svg>
